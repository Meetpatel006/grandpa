plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.magictext'
version = '0.7.10'

android {
  namespace "expo.modules.magictext"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation(platform("com.google.firebase:firebase-bom:34.13.0"))
  implementation("com.google.firebase:firebase-messaging")
}
